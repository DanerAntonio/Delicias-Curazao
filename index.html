/* PRODUCTOS - AGREGA O MODIFICA AQUÍ */

  },
  {

    category: "Sándwiches Cubanos",
    name: "Sándwich Cubano",
    description: "Pan cubano, jamón, queso, lechuga y tomate",

    image: "image/cubanos.jpg"
  },
  // 🎁 COMBOS Y PROMOCIONES
  {
    id: 7,

    price: 42000,
    oldPrice: 50000,
    image: "https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?w=400&h=300&fit=crop",
    badge: "Ahorra $8,000",
    featured: true
  },
  {
    id: 8,
    category: "Combos",
    name: "Combo Familiar",
    description: "4 Hamburguesas + 4 Jugos + Papas Jumbo + Postre",
    price: 75000,
    oldPrice: 90000,
    image: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=400&h=300&fit=crop",
    badge: "Ahorra $15,000",
    featured: true
  }
];

let cart = [];
let selectedCategory = "Todos";
let currentDeliveryFee = 0;
let selectedJuiceType = null;
let appliedCoupon = null;
let discountAmount = 0;

// 🎁 CUPONES DE DESCUENTO (Puedes cambiarlos)
const COUPONS = {
  'PRIMERA10': { discount: 10, description: '10% de descuento en tu primera compra' },
  'CURAZAO15': { discount: 15, description: '15% de descuento para residentes Curazao' },
  'COMBO20': { discount: 20, description: '20% de descuento en combos' },
  'FINDE25': { discount: 25, description: '25% de descuento fin de semana' }
};

document.addEventListener('DOMContentLoaded', () => {
  loadProductsFromSheet(); // Cargar desde Google Sheets
  updateCart();
});

function renderCategories() {
  const categories = ["Todos", ...new Set(PRODUCTS.map(p => p.category))];
  const container = document.getElementById('categories');
  
  container.innerHTML = categories.map(cat => `
    <button onclick="filterCategory('${cat}')" 
      class="px-4 py-2 rounded-full whitespace-nowrap font-medium transition ${
        selectedCategory === cat 
          ? 'bg-orange-500 text-white' 
          : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
      }">
      ${cat}
    </button>
  `).join('');
}

function filterCategory(category) {
  selectedCategory = category;
  renderCategories();
  renderMenu();
}

function renderMenu() {
  const filteredProducts = selectedCategory === "Todos" 
    ? PRODUCTS 
    : PRODUCTS.filter(p => p.category === selectedCategory);
  
  const container = document.getElementById('menuContainer');
  
  container.innerHTML = filteredProducts.map(product => `
    <div class="bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-xl transition-all hover:-translate-y-1 ${product.featured ? 'ring-2 ring-orange-400' : ''}">
      <div class="relative">
        <img src="${product.image}" alt="${product.name}" class="w-full h-48 object-cover" 
          onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&h=300&fit=crop'">
        
        ${product.badge ? `
          <div class="absolute top-2 right-2 bg-red-500 text-white px-3 py-1 rounded-full text-xs font-bold shadow-lg animate-pulse">
            ${product.badge}
          </div>
        ` : ''}
        
        ${product.oldPrice ? `
          <div class="absolute top-2 left-2 bg-green-500 text-white px-3 py-1 rounded-full text-xs font-bold shadow-lg">
            -${Math.round((1 - product.price / product.oldPrice) * 100)}% OFF
          </div>
        ` : ''}
      </div>
      
      <div class="p-6">
        <h3 class="text-xl font-bold text-gray-800 mb-2">${product.name}</h3>
        <p class="text-gray-600 text-sm mb-4">${product.description}</p>
        
        <div class="flex justify-between items-center">
          <div>
            ${product.oldPrice ? `
              <div class="text-sm text-gray-400 line-through">${product.oldPrice.toLocaleString()}</div>
            ` : ''}
            <span class="text-2xl font-bold text-orange-600">
              ${product.isJuice ? 'Desde ' : ''}${product.price.toLocaleString()}
            </span>
          </div>
          <button onclick="${product.isJuice ? 'openJuiceModal()' : `addToCart(${product.id})`}" 
            class="bg-orange-500 text-white px-4 py-2 rounded-lg hover:bg-orange-600 transition-all hover:scale-105 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            ${product.isJuice ? 'Personalizar' : 'Agregar'}
          </button>
        </div>
      </div>
    </div>
  `).join('');
}

/* MODAL JUGOS */
function openJuiceModal() {
  document.getElementById('juiceModal').classList.remove('hidden');
  document.getElementById('juiceModal').classList.add('flex');
  selectedJuiceType = null;
  document.getElementById('btnAgua').classList.remove('border-orange-500', 'bg-orange-50');
  document.getElementById('btnLeche').classList.remove('border-orange-500', 'bg-orange-50');
}

function closeJuiceModal() {
  document.getElementById('juiceModal').classList.add('hidden');
  document.getElementById('juiceModal').classList.remove('flex');
}

function selectJuiceType(type) {
  selectedJuiceType = type;
  document.getElementById('btnAgua').classList.remove('border-orange-500', 'bg-orange-50');
  document.getElementById('btnLeche').classList.remove('border-orange-500', 'bg-orange-50');
  
  if (type === 'agua') {
    document.getElementById('btnAgua').classList.add('border-orange-500', 'bg-orange-50');
  } else {
    document.getElementById('btnLeche').classList.add('border-orange-500', 'bg-orange-50');
  }
}

function addJuiceToCart() {
  if (!selectedJuiceType) {
    alert('⚠️ Por favor selecciona si quieres el jugo en agua o leche');
    return;
  }
  
  const flavor = document.getElementById('juiceFlavor').value;
  const price = selectedJuiceType === 'agua' ? 5000 : 7000;
  const prep = selectedJuiceType === 'agua' ? 'en Agua' : 'en Leche';
  
  const juiceProduct = {
    id: Date.now(),
    name: `Jugo de ${flavor} ${prep}`,
    price: price,
    image: "https://images.unsplash.com/photo-1622597467836-f3285f2131b8?w=400&h=300&fit=crop",
    quantity: 1
  };
  
  cart.push(juiceProduct);
  updateCart();
  closeJuiceModal();
  
  const badge = document.getElementById('cartCount');
  badge.classList.remove('cart-badge');
  setTimeout(() => badge.classList.add('cart-badge'), 10);
}

function addToCart(productId) {
  const product = PRODUCTS.find(p => p.id === productId);
  const existingItem = cart.find(item => item.id === productId);
  
  if (existingItem) {
    existingItem.quantity++;
  } else {
    cart.push({ ...product, quantity: 1 });
  }
  
  updateCart();
  
  const badge = document.getElementById('cartCount');
  badge.classList.remove('cart-badge');
  setTimeout(() => badge.classList.add('cart-badge'), 10);
}

function removeFromCart(itemId) {
  cart = cart.filter(item => item.id !== itemId);
  updateCart();
}

function updateQuantity(itemId, change) {
  const item = cart.find(item => item.id === itemId);
  if (item) {
    item.quantity = Math.max(1, item.quantity + change);
    updateCart();
  }
}

function updateDeliveryFee() {
  const location = document.getElementById('deliveryLocation').value;
  const curazaoDetails = document.getElementById('curazaoDetails');
  const otherAddress = document.getElementById('otherAddress');
  
  // Definir costos por ubicación
  const deliveryFees = {
    'curazao': 0,
    'unidad-paraiso': 3000,
    'unidad-bosques': 3500,
    'unidad-palmas': 4000,
    'otras': 5000
  };
  
  if (location === 'curazao') {
    currentDeliveryFee = deliveryFees[location];
    curazaoDetails.classList.remove('hidden');
    otherAddress.classList.add('hidden');
  } else if (location && location !== '') {
    currentDeliveryFee = deliveryFees[location] || 5000;
    curazaoDetails.classList.add('hidden');
    otherAddress.classList.remove('hidden');
  } else {
    currentDeliveryFee = 0;
    curazaoDetails.classList.add('hidden');
    otherAddress.classList.add('hidden');
  }
  
  updateCart();
}

function updateCart() {
  const cartItemsContainer = document.getElementById('cartItems');
  const emptyCart = document.getElementById('emptyCart');
  const customerForm = document.getElementById('customerForm');
  const cartCount = document.getElementById('cartCount');
  
  const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
  
  if (totalItems > 0) {
    cartCount.textContent = totalItems;
    cartCount.classList.remove('hidden');
  } else {
    cartCount.classList.add('hidden');
  }
  
  if (cart.length === 0) {
    emptyCart.classList.remove('hidden');
    customerForm.classList.add('hidden');
    cartItemsContainer.innerHTML = '';
    return;
  }
  
  emptyCart.classList.add('hidden');
  customerForm.classList.remove('hidden');
  
  cartItemsContainer.innerHTML = cart.map(item => `
    <div class="flex items-center gap-4 bg-gray-50 p-4 rounded-lg">
      <img src="${item.image}" alt="${item.name}" class="w-16 h-16 object-cover rounded">
      
      <div class="flex-1">
        <h4 class="font-semibold text-gray-800">${item.name}</h4>
        <p class="text-orange-600 font-bold">${item.price.toLocaleString()}</p>
      </div>
      
      <div class="flex items-center gap-2">
        <button onclick="updateQuantity(${item.id}, -1)" class="bg-gray-200 p-1 rounded hover:bg-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
          </svg>
        </button>
        
        <span class="font-bold w-8 text-center">${item.quantity}</span>
        
        <button onclick="updateQuantity(${item.id}, 1)" class="bg-gray-200 p-1 rounded hover:bg-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
        </button>
        
        <button onclick="removeFromCart(${item.id})" class="ml-2 text-red-500 hover:text-red-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
          </svg>
        </button>
      </div>
    </div>
  `).join('');
  
  const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
  
  // Calcular descuento si hay cupón aplicado
  discountAmount = appliedCoupon ? Math.round(subtotal * appliedCoupon.discount / 100) : 0;
  const subtotalAfterDiscount = subtotal - discountAmount;
  const total = subtotalAfterDiscount + currentDeliveryFee;
  
  document.getElementById('subtotalAmount').textContent = `${subtotal.toLocaleString()}`;
  
  // Mostrar/ocultar descuento
  if (discountAmount > 0) {
    document.getElementById('discountRow').classList.remove('hidden');
    document.getElementById('discountPercent').textContent = `${appliedCoupon.discount}%`;
    document.getElementById('discountAmount').textContent = `-${discountAmount.toLocaleString()}`;
  } else {
    document.getElementById('discountRow').classList.add('hidden');
  }
  
  if (currentDeliveryFee === 0) {
    document.getElementById('deliveryAmount').innerHTML = '<span class="text-green-600 font-bold">GRATIS</span>';
  } else {
    document.getElementById('deliveryAmount').textContent = `${currentDeliveryFee.toLocaleString()}`;
  }
  
  document.getElementById('totalAmount').textContent = `${total.toLocaleString()}`;
  
  const minOrderWarning = document.getElementById('minOrderWarning');
  if (subtotal < CONFIG.minOrder) {
    minOrderWarning.classList.remove('hidden');
  } else {
    minOrderWarning.classList.add('hidden');
  }
}

// 🎁 FUNCIÓN PARA APLICAR CUPONES
function applyCoupon() {
  const couponCode = document.getElementById('couponCode').value.trim().toUpperCase();
  const messageEl = document.getElementById('couponMessage');
  
  if (!couponCode) {
    messageEl.innerHTML = '<span class="text-red-500">⚠️ Ingresa un código de cupón</span>';
    return;
  }
  
  const coupon = COUPONS[couponCode];
  
  if (coupon) {
    appliedCoupon = coupon;
    messageEl.innerHTML = `<span class="text-green-600">✅ ${coupon.description}</span>`;
    updateCart();
  } else {
    messageEl.innerHTML = '<span class="text-red-500">❌ Cupón inválido</span>';
    appliedCoupon = null;
    discountAmount = 0;
    updateCart();
  }
}

function toggleCart() {
  document.getElementById('cartSidebar').classList.toggle('hidden');
}

function closeCartOnOverlay(event) {
  if (event.target.id === 'cartSidebar') {
    toggleCart();
  }
}

function sendToWhatsApp() {
  const name = document.getElementById('customerName').value.trim();
  const phone = document.getElementById('customerPhone').value.trim();
  const location = document.getElementById('deliveryLocation').value;
  const notes = document.getElementById('customerNotes').value.trim();
  
  let address = '';
  
  // Validaciones
  if (!name || !phone || !location) {
    alert('⚠️ Por favor completa todos los campos obligatorios');
    return;
  }
  
  if (location === 'curazao') {
    const tower = document.getElementById('tower').value;
    const apartment = document.getElementById('apartment').value.trim();
    
    if (!tower || !apartment) {
      alert('⚠️ Por favor selecciona la torre y número de apartamento');
      return;
    }
    
    address = `Unidad Curazao - ${tower}, Apto ${apartment}`;
  } else if (location === 'otras') {
    address = document.getElementById('customerAddress').value.trim();
    
    if (!address) {
      alert('⚠️ Por favor ingresa la dirección de entrega');
      return;
    }
  }
  
  const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
  
  if (subtotal < CONFIG.minOrder) {
    alert(`⚠️ El pedido mínimo es de ${CONFIG.minOrder.toLocaleString()}`);
    return;
  }
  
  const total = subtotal + currentDeliveryFee;
  const orderId = 'PED' + Date.now().toString().slice(-6);
  
  // 💾 GUARDAR PEDIDO EN GOOGLE SHEETS
  const productosTexto = cart.map(item => `${item.quantity}x ${item.name}`).join(', ');
  
  try {
    const formData = new FormData();
    formData.append('action', 'newOrder');
    formData.append('nombre', name);
    formData.append('telefono', phone);
    formData.append('direccion', address);
    formData.append('productos', productosTexto);
    formData.append('subtotal', subtotal);
    formData.append('domicilio', currentDeliveryFee);
    formData.append('total', total);
    
    fetch(CONFIG.SHEET_API_URL, {
      method: 'POST',
      body: formData
    });
  } catch (error) {
    console.error('Error guardando pedido:', error);
  }
  
  // Nombres amigables de ubicaciones
  const locationNames = {
    'curazao': 'Unidad Curazao (sin costo)',
    'unidad-paraiso': 'Unidad Paraíso (+$3,000)',
    'unidad-bosques': 'Unidad Los Bosques (+$3,500)',
    'unidad-palmas': 'Unidad Las Palmas (+$4,000)',
    'otras': 'Otras zonas (+$5,000)'
  };
  
  // Mensaje para el NEGOCIO
  let messageBusiness = `*🛍️ NUEVO PEDIDO - ${orderId}*\n\n`;
  messageBusiness += `*📋 CLIENTE:*\n`;
  messageBusiness += `• Nombre: ${name}\n`;
  messageBusiness += `• Teléfono: ${phone}\n`;
  messageBusiness += `• Dirección: ${address}\n`;
  messageBusiness += `• Zona: ${locationNames[location] || location}\n\n`;
  messageBusiness += `*🍔 PEDIDO:*\n`;
  
  cart.forEach(item => {
    messageBusiness += `${item.quantity}x ${item.name} - ${(item.price * item.quantity).toLocaleString()}\n`;
  });
  
  messageBusiness += `\n*💰 RESUMEN:*\n`;
  messageBusiness += `• Subtotal: ${subtotal.toLocaleString()}\n`;
  messageBusiness += `• Domicilio: ${currentDeliveryFee === 0 ? 'GRATIS' : '$' + currentDeliveryFee.toLocaleString()}\n`;
  messageBusiness += `• *TOTAL: ${total.toLocaleString()}*\n`;
  
  if (notes) {
    messageBusiness += `\n*📝 Observaciones:* ${notes}`;
  }
  
  // Mensaje para el DOMICILIARIO (solo si hay costo de domicilio)
  if (currentDeliveryFee > 0) {
    let messageDelivery = `*🛵 NUEVO SERVICIO - ${orderId}*\n\n`;
    messageDelivery += `*📍 RECOGER EN:*\n${CONFIG.businessAddress}\n\n`;
    messageDelivery += `*🏠 ENTREGAR A:*\n`;
    messageDelivery += `• Cliente: ${name}\n`;
    messageDelivery += `• Teléfono: ${phone}\n`;
    messageDelivery += `• Dirección: ${address}\n\n`;
    messageDelivery += `*📦 PEDIDO:*\n`;
    
    cart.forEach(item => {
      messageDelivery += `• ${item.quantity}x ${item.name}\n`;
    });
    
    messageDelivery += `\n*💵 TU GANANCIA: ${currentDeliveryFee.toLocaleString()}*\n`;
    messageDelivery += `*💰 COBRAR AL CLIENTE: ${total.toLocaleString()}*\n`;
    messageDelivery += `(Entregar al negocio: ${subtotal.toLocaleString()})\n`;
    
    if (notes) {
      messageDelivery += `\n*📝 Nota:* ${notes}`;
    }
    
    messageDelivery += `\n\n⚠️ *Por favor confirma recibido*`;
    
    // Enviar a ambos
    window.open(`https://wa.me/${CONFIG.businessPhone}?text=${encodeURIComponent(messageBusiness)}`, '_blank');
    
    setTimeout(() => {
      window.open(`https://wa.me/${CONFIG.deliveryPhone}?text=${encodeURIComponent(messageDelivery)}`, '_blank');
    }, 1000);
  } else {
    // Solo enviar al negocio si es Curazao (domicilio gratis)
    messageBusiness += `\n\n✅ _Pedido interno - Sin domiciliario externo_`;
    window.open(`https://wa.me/${CONFIG.businessPhone}?text=${encodeURIComponent(messageBusiness)}`, '_blank');
  }
  
  // Limpiar y cerrar
  setTimeout(() => {
    alert('✅ ¡Pedido enviado! Recibirás confirmación pronto.');
    cart = [];
    currentDeliveryFee = 0;
    updateCart();
    toggleCart();
    
    // Limpiar formulario
    document.getElementById('customerName').value = '';
    document.getElementById('customerPhone').value = '';
    document.getElementById('deliveryLocation').value = '';
    document.getElementById('tower').value = '';
    document.getElementById('apartment').value = '';
    document.getElementById('customerAddress').value = '';
    document.getElementById('customerNotes').value = '';
    document.getElementById('curazaoDetails').classList.add('hidden');
    document.getElementById('otherAddress').classList.add('hidden');
  }, currentDeliveryFee > 0 ? 2000 : 1000);
}
</script>
