<script>
/* ================= CONFIG ================= */
const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzRgJ1HNHMVOfjHk-i9PLFtRLfjtzSfQ-LdCvzfLoJJ8niMIO7ULW1tImbTz1K2DrY1ZQ/exec";

const WHATSAPP = "573027012881";

/* ================= ESTADO ================= */
let PRODUCTS = [];
let cart = [];
let categorySelected = "Todos";

/* ================= INIT ================= */
document.addEventListener("DOMContentLoaded", loadProducts);

/* ================= PRODUCTOS ================= */
async function loadProducts() {
  try {
    const res = await fetch(`${SCRIPT_URL}?action=getProducts`);
    PRODUCTS = await res.json();
    renderCategories();
    renderMenu();
  } catch (e) {
    alert("❌ Error cargando productos");
    console.error(e);
  }
}

/* ================= UI ================= */
function renderCategories() {
  const cats = ["Todos", ...new Set(PRODUCTS.map(p => p.category))];
  categories.innerHTML = cats.map(c => `
    <button onclick="filterCategory('${c}')"
      class="px-4 py-2 rounded-full ${
        c === categorySelected ? "bg-orange-500 text-white" : "bg-gray-200"
      }">
      ${c}
    </button>
  `).join("");
}

function filterCategory(cat) {
  categorySelected = cat;
  renderCategories();
  renderMenu();
}

function renderMenu() {
  const list = categorySelected === "Todos"
    ? PRODUCTS
    : PRODUCTS.filter(p => p.category === categorySelected);

  menu.innerHTML = list.map(p => `
    <div class="bg-white rounded shadow">
      <img src="${p.image}" class="h-40 w-full object-cover">
      <div class="p-4">
        <h3 class="font-bold">${p.name}</h3>
        <p class="text-sm text-gray-500">${p.description}</p>
        <div class="flex justify-between items-center mt-3">
          <span class="text-orange-600 font-bold">$${Number(p.price).toLocaleString()}</span>
          <button onclick="addToCart(${p.id})"
            class="bg-orange-500 text-white px-3 py-1 rounded">
            Agregar
          </button>
        </div>
      </div>
    </div>
  `).join("");
}

/* ================= CARRITO ================= */
function addToCart(id) {
  const p = PRODUCTS.find(x => x.id == id);
  const item = cart.find(i => i.id == id);
  item ? item.qty++ : cart.push({ id:p.id, name:p.name, price:p.price, qty:1 });
  updateCart();
}

function updateCart() {
  let total = 0;
  cartItems.innerHTML = cart.map(i => {
    total += i.price * i.qty;
    return `
      <div class="flex justify-between border-b py-2">
        <span>${i.qty}x ${i.name}</span>
        <span>$${(i.price*i.qty).toLocaleString()}</span>
      </div>
    `;
  }).join("");

  subtotal.innerText = `$${total.toLocaleString()}`;
  totalSpan.innerText = `$${total.toLocaleString()}`;
  cartCount.innerText = cart.reduce((s,i)=>s+i.qty,0);
  cartCount.classList.toggle("hidden", cart.length===0);
}

function toggleCart() {
  cart.classList.toggle("hidden");
}

/* ================= GUARDAR PEDIDO ================= */
async function sendToWhatsApp() {
  if (!cart.length) return alert("Carrito vacío");

  const cliente = prompt("Tu nombre:");
  const telefono = prompt("Tu teléfono:");
  const direccion = prompt("Dirección de entrega:");

  if (!cliente || !telefono || !direccion) {
    return alert("❌ Datos incompletos");
  }

  const subtotal = cart.reduce((s,i)=>s+i.price*i.qty,0);

  // 🔴 GUARDAR EN SHEET
  await fetch(`${SCRIPT_URL}?action=newOrder`, {
    method: "POST",
    body: JSON.stringify({
      cliente,
      telefono,
      direccion,
      productos: cart,     // 🔑 ARRAY REAL
      subtotal,
      domicilio: 0,
      total: subtotal
    })
  });

  // 🟢 ENVIAR A WHATSAPP
  let msg = "🛒 *Nuevo Pedido*%0A%0A";
  cart.forEach(i=>{
    msg += `${i.qty}x ${i.name} - $${(i.price*i.qty).toLocaleString()}%0A`;
  });
  msg += `%0A*TOTAL: $${subtotal.toLocaleString()}*`;

  window.open(`https://wa.me/${WHATSAPP}?text=${msg}`);

  cart = [];
  updateCart();
  toggleCart();
}
</script>
