<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Delicias Curazao</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-orange-50">

<header class="bg-white shadow p-4 flex justify-between">
  <h1 class="text-xl font-bold text-orange-600">🍔 Delicias Curazao</h1>
  <button onclick="toggleCart()" class="bg-orange-500 text-white px-4 py-2 rounded">
    🛒 <span id="cartCount">0</span>
  </button>
</header>

<div id="categories" class="flex gap-2 p-4 overflow-x-auto"></div>

<main id="menu" class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4"></main>

<!-- CART -->
<div id="cartBox" class="fixed inset-0 bg-black bg-opacity-50 hidden">
  <div class="absolute right-0 top-0 w-full md:w-96 bg-white h-full p-4">
    <h2 class="font-bold text-lg mb-2">🛒 Pedido</h2>
    <div id="cartItems"></div>

    <input id="name" class="border p-2 w-full my-1" placeholder="Nombre">
    <input id="phone" class="border p-2 w-full my-1" placeholder="Teléfono">
    <input id="address" class="border p-2 w-full my-1" placeholder="Dirección">

    <p class="font-bold mt-2">Total: $<span id="total">0</span></p>

    <button onclick="sendOrder()" class="bg-green-500 text-white w-full py-2 mt-2 rounded">
      Enviar Pedido
    </button>
    <button onclick="toggleCart()" class="bg-gray-300 w-full py-2 mt-2 rounded">
      Cerrar
    </button>
  </div>
</div>

<script>
/******** CONFIG *********/
const API_URL = "https://script.google.com/macros/s/AKfycbzz2MALrSrpNMlTGlDWRbrEIYvdNSXuto1nYSd6XQ-6R_c2cxyu3c3zeE-_ecQVmNokiw/exec";
let PRODUCTS = [];
let cart = [];
let currentCategory = "Todos";

/******** LOAD PRODUCTS (JSONP) *********/
function loadProducts() {
  const s = document.createElement("script");
  s.src = API_URL + "?action=getProducts&callback=onProductsLoaded";
  document.body.appendChild(s);
}

function onProductsLoaded(data) {
  PRODUCTS = data;
  renderCategories();
  renderMenu();
}

/******** CATEGORIES *********/
function renderCategories() {
  const cats = ["Todos", ...new Set(PRODUCTS.map(p => p.category))];
  categories.innerHTML = cats.map(c => `
    <button onclick="selectCategory('${c}')"
      class="px-3 py-1 rounded ${c===currentCategory?'bg-orange-500 text-white':'bg-gray-200'}">
      ${c}
    </button>
  `).join("");
}

function selectCategory(cat) {
  currentCategory = cat;
  renderCategories();
  renderMenu();
}

/******** MENU *********/
function renderMenu() {
  const list = currentCategory==="Todos"
    ? PRODUCTS
    : PRODUCTS.filter(p => p.category === currentCategory);

  menu.innerHTML = list.map(p => `
    <div class="bg-white p-4 rounded shadow">
      <img src="${p.image}" class="h-40 w-full object-cover rounded"
        onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400'">
      <h3 class="font-bold mt-2">${p.name}</h3>
      <p class="text-sm">${p.description}</p>
      <div class="flex justify-between mt-2">
        <span class="font-bold text-orange-600">$${p.price}</span>
        <button onclick="addToCart(${p.id})"
          class="bg-orange-500 text-white px-3 py-1 rounded">Agregar</button>
      </div>
    </div>
  `).join("");
}

/******** CART *********/
function addToCart(id) {
  const p = PRODUCTS.find(x => x.id == id);
  const item = cart.find(i => i.id == id);
  if (item) item.qty++;
  else cart.push({...p, qty:1});
  updateCart();
}

function updateCart() {
  cartCount.textContent = cart.reduce((s,i)=>s+i.qty,0);
  cartItems.innerHTML = cart.map(i => `
    <div class="flex justify-between border-b py-1">
      <span>${i.qty}x ${i.name}</span>
      <span>$${i.qty*i.price}</span>
    </div>
  `).join("");
  total.textContent = cart.reduce((s,i)=>s+i.qty*i.price,0);
}

function toggleCart() {
  cartBox.classList.toggle("hidden");
}

/******** SEND ORDER *********/
function sendOrder() {
  fetch(API_URL + "?action=newOrder", {
    method:"POST",
    body: JSON.stringify({
      nombre: name.value,
      telefono: phone.value,
      direccion: address.value,
      productos: cart.map(i=>`${i.qty}x ${i.name}`).join(", "),
      subtotal: total.textContent,
      domicilio: 0,
      total: total.textContent
    })
  }).then(()=>{
    alert("Pedido enviado ✅");
    cart=[]; updateCart(); toggleCart();
  });
}

loadProducts();
</script>

</body>
</html>
