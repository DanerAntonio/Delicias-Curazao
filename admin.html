<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin - Delicias Curazao</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<header class="bg-orange-600 text-white p-4 flex justify-between items-center">
  <h1 class="text-xl font-bold">🍔 Admin - Delicias Curazao</h1>
  <button onclick="logout()" class="bg-red-500 px-4 py-2 rounded">
    Cerrar sesión
  </button>
</header>

<!-- LOGIN -->
<div id="loginScreen" class="max-w-md mx-auto mt-20 bg-white p-6 rounded shadow">
  <h2 class="text-xl font-bold mb-4 text-center">Ingreso Admin</h2>
  <input id="password" type="password" placeholder="Contraseña"
    class="border p-2 w-full mb-3">
  <button onclick="login()"
    class="bg-orange-500 text-white w-full py-2 rounded">
    Entrar
  </button>
</div>

<!-- PANEL -->
<div id="panel" class="hidden max-w-6xl mx-auto p-4">
  <h2 class="text-2xl font-bold mb-4">📋 Pedidos</h2>

  <div class="flex gap-2 mb-4 flex-wrap">
    <button onclick="filterStatus('ALL')" class="px-3 py-1 bg-gray-300 rounded">Todos</button>
    <button onclick="filterStatus('NUEVO')" class="px-3 py-1 bg-yellow-400 rounded">Nuevos</button>
    <button onclick="filterStatus('ACEPTADO')" class="px-3 py-1 bg-blue-400 rounded">Aceptados</button>
    <button onclick="filterStatus('EN_CAMINO')" class="px-3 py-1 bg-orange-400 rounded">En camino</button>
    <button onclick="filterStatus('ENTREGADO')" class="px-3 py-1 bg-green-400 rounded">Entregados</button>
  </div>

  <div id="orders" class="space-y-3"></div>
</div>

<script>
/******** CONFIG ********/
const API_URL =
"https://script.google.com/macros/s/AKfycbzRgJ1HNHMVOfjHk-i9PLFtRLfjtzSfQ-LdCvzfLoJJ8niMIO7ULW1tImbTz1K2DrY1ZQ/exec";

const ADMIN_PASSWORD = "admin123";

let ORDERS = [];
let CURRENT_FILTER = "ALL";

/******** LOGIN ********/
function login() {
  if (password.value === ADMIN_PASSWORD) {
    loginScreen.classList.add("hidden");
    panel.classList.remove("hidden");
    loadOrders();
  } else {
    alert("❌ Contraseña incorrecta");
  }
}

function logout() {
  location.reload();
}

/******** LOAD PEDIDOS ********/
async function loadOrders() {
  const res = await fetch(API_URL + "?action=getPedidos");
  ORDERS = (await res.json()).reverse();
  renderOrders();
}

/******** FILTER ********/
function filterStatus(status) {
  CURRENT_FILTER = status;
  renderOrders();
}

/******** RENDER ********/
function renderOrders() {
  const list = CURRENT_FILTER === "ALL"
    ? ORDERS
    : ORDERS.filter(o => o.estado === CURRENT_FILTER);

  orders.innerHTML = list.map(o => `
    <div class="bg-white p-4 rounded shadow border-l-4 ${statusColor(o.estado)}">
      <div class="flex justify-between">
        <div>
          <h3 class="font-bold">${o.id}</h3>
          <p class="text-sm">${o.cliente} - ${o.telefono}</p>
          <p class="text-sm text-gray-600">${o.direccion}</p>
          <p class="text-xs text-gray-400">${new Date(o.fecha).toLocaleString()}</p>
        </div>
        <div class="text-right">
          <p class="font-bold text-lg">$${Number(o.total).toLocaleString()}</p>
          <span class="text-xs px-2 py-1 rounded bg-gray-200">${o.estado}</span>
        </div>
      </div>

      <div class="mt-2 text-sm">
        <b>Pedido:</b>
        <ul class="list-disc ml-5">
          ${o.productos.map(p => `<li>${p.qty}x ${p.name}</li>`).join("")}
        </ul>
      </div>

      <div class="flex gap-2 mt-3 flex-wrap">
        ${o.estado === "NUEVO" ? `
          <button onclick="updateStatus('${o.id}','ACEPTADO')"
            class="bg-blue-500 text-white px-3 py-1 rounded">Aceptar</button>
        ` : ""}
        ${o.estado === "ACEPTADO" ? `
          <button onclick="updateStatus('${o.id}','EN_CAMINO')"
            class="bg-orange-500 text-white px-3 py-1 rounded">Enviar</button>
        ` : ""}
        ${o.estado === "EN_CAMINO" ? `
          <button onclick="updateStatus('${o.id}','ENTREGADO')"
            class="bg-green-500 text-white px-3 py-1 rounded">Entregado</button>
        ` : ""}
      </div>
    </div>
  `).join("");
}

/******** STATUS ********/
function statusColor(status) {
  return {
    NUEVO: "border-yellow-400",
    ACEPTADO: "border-blue-400",
    EN_CAMINO: "border-orange-400",
    ENTREGADO: "border-green-400"
  }[status] || "border-gray-300";
}

/******** UPDATE ********/
function updateStatus(id, estado) {
  fetch(API_URL + "?action=updateOrder", {
    method: "POST",
    body: JSON.stringify({ id, estado })
  }).then(loadOrders);
}
</script>

</body>
</html>
