<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin - Delicias Curazao</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<header class="bg-orange-600 text-white p-4 flex justify-between items-center">
  <h1 class="text-xl font-bold">🍔 Admin - Delicias Curazao</h1>
  <button onclick="logout()" class="bg-red-500 px-4 py-2 rounded">
    Cerrar sesión
  </button>
</header>

<!-- LOGIN -->
<div id="loginScreen" class="max-w-md mx-auto mt-20 bg-white p-6 rounded shadow">
  <h2 class="text-xl font-bold mb-4 text-center">Ingreso Admin</h2>
  <input id="password" type="password" placeholder="Contraseña"
    class="border p-2 w-full mb-3">
  <button onclick="login()"
    class="bg-orange-500 text-white w-full py-2 rounded">
    Entrar
  </button>
</div>

<!-- PANEL -->
<div id="panel" class="hidden max-w-6xl mx-auto p-4">

  <h2 class="text-2xl font-bold mb-4">📋 Pedidos</h2>

  <div class="flex gap-2 mb-4">
    <button onclick="filterStatus('ALL')" class="px-3 py-1 bg-gray-300 rounded">Todos</button>
    <button onclick="filterStatus('PENDING')" class="px-3 py-1 bg-yellow-400 rounded">Pendientes</button>
    <button onclick="filterStatus('ACCEPTED')" class="px-3 py-1 bg-blue-400 rounded">Aceptados</button>
    <button onclick="filterStatus('DELIVERED')" class="px-3 py-1 bg-green-400 rounded">Entregados</button>
  </div>

  <div id="orders" class="space-y-3"></div>
</div>

<script>
/******** CONFIG ********/
const API_URL = "https://script.google.com/macros/s/AKfycbzz2MALrSrpNMlTGlDWRbrEIYvdNSXuto1nYSd6XQ-6R_c2cxyu3c3zeE-_ecQVmNokiw/exec";
const ADMIN_PASSWORD = "admin123";

let ORDERS = [];
let CURRENT_FILTER = "ALL";

/******** LOGIN ********/
function login() {
  if (password.value === ADMIN_PASSWORD) {
    loginScreen.classList.add("hidden");
    panel.classList.remove("hidden");
    loadOrders();
  } else {
    alert("❌ Contraseña incorrecta");
  }
}

function logout() {
  location.reload();
}

/******** LOAD ORDERS (JSONP) ********/
function loadOrders() {
  const s = document.createElement("script");
  s.src = API_URL + "?action=getOrders&callback=onOrdersLoaded";
  document.body.appendChild(s);
}

function onOrdersLoaded(data) {
  ORDERS = data.reverse();
  renderOrders();
}

/******** FILTER ********/
function filterStatus(status) {
  CURRENT_FILTER = status;
  renderOrders();
}

/******** RENDER ********/
function renderOrders() {
  const list = CURRENT_FILTER === "ALL"
    ? ORDERS
    : ORDERS.filter(o => o.status === CURRENT_FILTER);

  orders.innerHTML = list.map(o => `
    <div class="bg-white p-4 rounded shadow border-l-4 ${statusColor(o.status)}">
      <div class="flex justify-between">
        <div>
          <h3 class="font-bold">${o.orderId}</h3>
          <p class="text-sm">${o.name} - ${o.phone}</p>
          <p class="text-sm text-gray-600">${o.address}</p>
          <p class="text-xs text-gray-400">${o.date}</p>
        </div>
        <div class="text-right">
          <p class="font-bold text-lg">$${o.total}</p>
          <span class="text-xs px-2 py-1 rounded bg-gray-200">${o.status}</span>
        </div>
      </div>

      <p class="mt-2 text-sm"><b>Pedido:</b> ${o.items}</p>

      <div class="flex gap-2 mt-3">
        ${o.status === "PENDING" ? `
          <button onclick="updateStatus('${o.orderId}','ACCEPTED')"
            class="bg-blue-500 text-white px-3 py-1 rounded">Aceptar</button>
        ` : ""}
        ${o.status === "ACCEPTED" ? `
          <button onclick="updateStatus('${o.orderId}','IN_DELIVERY')"
            class="bg-orange-500 text-white px-3 py-1 rounded">Enviar</button>
        ` : ""}
        ${o.status === "IN_DELIVERY" ? `
          <button onclick="updateStatus('${o.orderId}','DELIVERED')"
            class="bg-green-500 text-white px-3 py-1 rounded">Entregado</button>
        ` : ""}
      </div>
    </div>
  `).join("");
}

/******** STATUS ********/
function statusColor(status) {
  if (status === "PENDING") return "border-yellow-400";
  if (status === "ACCEPTED") return "border-blue-400";
  if (status === "IN_DELIVERY") return "border-orange-400";
  if (status === "DELIVERED") return "border-green-400";
  return "border-gray-300";
}

function updateStatus(id, status) {
  fetch(API_URL +
    "?action=updateOrderStatus" +
    "&id=" + id +
    "&status=" + status
  ).then(() => {
    loadOrders();
  });
}
</script>

</body>
</html>
