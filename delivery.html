<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domiciliarios - Delicias Curazao</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .new-order { animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- HEADER -->
<header class="bg-blue-600 text-white p-4 shadow-lg sticky top-0 z-10">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold">🛵 Pedidos Disponibles</h1>
      <p class="text-sm" id="deliveryName">Domiciliario</p>
    </div>
    <div class="text-right">
      <p class="text-2xl font-bold" id="earnings">$0</p>
      <p class="text-xs">Ganado hoy</p>
    </div>
  </div>
</header>

<!-- LOGIN DOMICILIARIO -->
<div id="loginScreen" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-lg shadow-lg">
  <h2 class="text-2xl font-bold text-center mb-6">Iniciar Sesión</h2>
  <input type="text" id="deliveryNameInput" placeholder="Tu nombre" 
    class="w-full px-4 py-3 border rounded-lg mb-4">
  <input type="tel" id="deliveryPhone" placeholder="Tu teléfono" 
    class="w-full px-4 py-3 border rounded-lg mb-4">
  <button onclick="loginDelivery()" class="w-full bg-blue-500 text-white py-3 rounded-lg font-bold hover:bg-blue-600">
    Entrar
  </button>
</div>

<!-- PEDIDOS DISPONIBLES -->
<div id="ordersScreen" class="hidden max-w-2xl mx-auto p-4">
  
  <!-- Estadísticas -->
  <div class="grid grid-cols-3 gap-4 mb-4">
    <div class="bg-white p-4 rounded-lg shadow text-center">
      <p class="text-2xl font-bold text-blue-600" id="totalOrders">0</p>
      <p class="text-xs text-gray-600">Entregas hoy</p>
    </div>
    <div class="bg-white p-4 rounded-lg shadow text-center">
      <p class="text-2xl font-bold text-green-600" id="completedOrders">0</p>
      <p class="text-xs text-gray-600">Completadas</p>
    </div>
    <div class="bg-white p-4 rounded-lg shadow text-center">
      <p class="text-2xl font-bold text-yellow-600" id="pendingOrders">2</p>
      <p class="text-xs text-gray-600">Disponibles</p>
    </div>
  </div>

  <!-- Pedidos Nuevos -->
  <div class="mb-4">
    <h2 class="text-lg font-bold mb-3 flex items-center gap-2">
      🔥 Pedidos Nuevos
      <span class="bg-red-500 text-white text-xs px-2 py-1 rounded-full">2</span>
    </h2>
    
    <div class="space-y-3" id="newOrdersList">
      <!-- Se llenan dinámicamente -->
    </div>
  </div>

  <!-- Mis Pedidos Activos -->
  <div>
    <h2 class="text-lg font-bold mb-3">📦 Mis Pedidos Activos</h2>
    <div class="space-y-3" id="myOrdersList">
      <div class="bg-white p-4 rounded-lg shadow">
        <p class="text-center text-gray-500">No tienes pedidos activos</p>
      </div>
    </div>
  </div>
</div>

<!-- MODAL DETALLES PEDIDO -->
<div id="orderModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-lg max-w-md w-full p-6">
    <h3 class="text-xl font-bold mb-4" id="modalOrderId">Pedido #123456</h3>
    
    <div class="space-y-3 mb-4" id="modalContent">
      <!-- Detalles del pedido -->
    </div>

    <div class="bg-green-100 border border-green-300 rounded-lg p-4 mb-4">
      <p class="font-bold text-green-800 text-lg">💵 Tu Ganancia: <span id="modalEarning"></span></p>
      <p class="text-sm text-green-700">Cobrar al cliente: <span id="modalTotal"></span></p>
    </div>

    <div class="flex gap-2">
      <button onclick="acceptOrder()" class="flex-1 bg-green-500 text-white py-3 rounded-lg font-bold hover:bg-green-600">
        ✅ Aceptar Pedido
      </button>
      <button onclick="closeOrderModal()" class="flex-1 bg-gray-300 py-3 rounded-lg font-bold hover:bg-gray-400">
        Cerrar
      </button>
    </div>
  </div>
</div>

<script>
// 🔗 CONFIGURACIÓN - PEGA LA URL DE TU APPS SCRIPT
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzFU-iPQ5jVsGySfzqWc48jLkZLwfvSjJuxclmred1eAf0OL2wRN1gE-RB5rEEUn_k9qQ/exec";

// Datos
let deliveryInfo = null;
let currentOrder = null;
let myOrders = [];
let earnings = 0;
let availableOrders = [];

// 🔄 CARGAR PEDIDOS DESDE GOOGLE SHEETS
async function loadOrdersFromSheet() {
  try {
    const response = await fetch(`${SHEET_API_URL}?action=getPedidos`);
    const pedidos = await response.json();
    
    // Filtrar solo pedidos NUEVOS
    availableOrders = pedidos.filter(p => p.estado === 'NUEVO');
    
    document.getElementById('pendingOrders').textContent = availableOrders.length;
    loadOrders();
    
  } catch (error) {
    console.error('Error cargando pedidos:', error);
  }
}

// Auto-actualizar cada 30 segundos
setInterval(() => {
  if (deliveryInfo) {
    loadOrdersFromSheet();
  }
}, 30000);

function loginDelivery() {
  const name = document.getElementById('deliveryNameInput').value.trim();
  const phone = document.getElementById('deliveryPhone').value.trim();
  
  if (!name || !phone) {
    alert('⚠️ Por favor completa todos los campos');
    return;
  }
  
  deliveryInfo = { name, phone };
  document.getElementById('deliveryName').textContent = name;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('ordersScreen').classList.remove('hidden');
  
  loadOrdersFromSheet(); // Cargar desde Google Sheets
}

function loadOrders() {
  const container = document.getElementById('newOrdersList');
  
  if (availableOrders.length === 0) {
    container.innerHTML = '<div class="bg-white p-4 rounded-lg shadow"><p class="text-center text-gray-500">No hay pedidos disponibles</p></div>';
    return;
  }
  
  container.innerHTML = availableOrders.map(order => `
    <div class="bg-white border-l-4 border-yellow-500 rounded-lg shadow p-4 new-order">
      <div class="flex justify-between items-start mb-2">
        <div>
          <span class="font-bold text-lg">${order.id}</span>
          <span class="ml-2 bg-yellow-200 text-yellow-800 px-2 py-1 rounded text-xs">Nuevo</span>
        </div>
        <div class="text-right">
          <p class="text-xl font-bold text-green-600">${(order.domicilio || 3000).toLocaleString()}</p>
        </div>
      </div>
      
      <div class="text-sm space-y-1 mb-3">
        <p><strong>Cliente:</strong> ${order.cliente}</p>
        <p><strong>Teléfono:</strong> ${order.telefono}</p>
        <p><strong>Entregar:</strong> ${order.direccion}</p>
        <p><strong>Productos:</strong> ${order.productos}</p>
      </div>
      
      <button onclick="viewOrder('${order.id}')" 
        class="w-full bg-blue-500 text-white py-2 rounded font-semibold hover:bg-blue-600">
        Ver Detalles
      </button>
    </div>
  `).join('');
}

function viewOrder(orderId) {
  currentOrder = availableOrders.find(o => o.id === orderId);
  
  document.getElementById('modalOrderId').textContent = `Pedido ${currentOrder.id}`;
  document.getElementById('modalEarning').textContent = `$${currentOrder.earning.toLocaleString()}`;
  document.getElementById('modalTotal').textContent = `$${currentOrder.total.toLocaleString()}`;
  
  document.getElementById('modalContent').innerHTML = `
    <div class="bg-blue-50 p-3 rounded">
      <p class="font-semibold text-blue-900">📍 Recoger en:</p>
      <p class="text-sm">${currentOrder.pickupAddress}</p>
    </div>
    
    <div class="bg-orange-50 p-3 rounded">
      <p class="font-semibold text-orange-900">🏠 Entregar a:</p>
      <p class="text-sm">${currentOrder.client} - ${currentOrder.phone}</p>
      <p class="text-sm">${currentOrder.address}</p>
    </div>
    
    <div class="border-t pt-3">
      <p class="font-semibold mb-2">📦 Productos:</p>
      ${currentOrder.items.map(item => `<p class="text-sm">• ${item}</p>`).join('')}
    </div>
    
    <div class="flex gap-2 text-sm">
      <a href="https://wa.me/57${currentOrder.phone}" target="_blank" 
        class="flex-1 bg-green-500 text-white py-2 rounded text-center">
        📞 Llamar Cliente
      </a>
      <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(currentOrder.address)}" 
        target="_blank" class="flex-1 bg-blue-500 text-white py-2 rounded text-center">
        🗺️ Ver Mapa
      </a>
    </div>
  `;
  
  document.getElementById('orderModal').classList.remove('hidden');
}

function acceptOrder() {
  if (!currentOrder) return;
  
  myOrders.push({...currentOrder, status: 'activo', acceptedAt: new Date()});
  earnings += currentOrder.earning;
  
  document.getElementById('earnings').textContent = `$${earnings.toLocaleString()}`;
  document.getElementById('completedOrders').textContent = myOrders.filter(o => o.status === 'completado').length;
  document.getElementById('totalOrders').textContent = myOrders.length;
  
  // Remover de disponibles
  const index = availableOrders.findIndex(o => o.id === currentOrder.id);
  availableOrders.splice(index, 1);
  
  document.getElementById('pendingOrders').textContent = availableOrders.length;
  
  alert('✅ Pedido aceptado! Revisa "Mis Pedidos Activos"');
  
  closeOrderModal();
  loadOrders();
  loadMyOrders();
}

function loadMyOrders() {
  const container = document.getElementById('myOrdersList');
  
  if (myOrders.length === 0) {
    container.innerHTML = '<div class="bg-white p-4 rounded-lg shadow"><p class="text-center text-gray-500">No tienes pedidos activos</p></div>';
    return;
  }
  
  container.innerHTML = myOrders.map(order => `
    <div class="bg-white border-l-4 border-green-500 rounded-lg shadow p-4">
      <div class="flex justify-between mb-2">
        <span class="font-bold">${order.id}</span>
        <span class="bg-green-200 text-green-800 px-2 py-1 rounded text-xs">En Progreso</span>
      </div>
      <p class="text-sm mb-2"><strong>Entregar:</strong> ${order.address}</p>
      <button onclick="completeOrder('${order.id}')" 
        class="w-full bg-green-500 text-white py-2 rounded font-semibold">
        ✅ Marcar como Entregado
      </button>
    </div>
  `).join('');
}

function completeOrder(orderId) {
  const order = myOrders.find(o => o.id === orderId);
  order.status = 'completado';
  
  document.getElementById('completedOrders').textContent = myOrders.filter(o => o.status === 'completado').length;
  
  alert(`✅ ¡Pedido ${orderId} completado! +$${order.earning.toLocaleString()}`);
  
  myOrders = myOrders.filter(o => o.status !== 'completado');
  loadMyOrders();
}

function closeOrderModal() {
  document.getElementById('orderModal').classList.add('hidden');
  currentOrder = null;
}
</script>

</body>
</html>
